[pytest]
# pytest's default norecursedirs includes "build", which would otherwise
# silently skip harness/build/test_pki_reproducibility.py (the
# reproducibility check for generate-pki.sh) from `python -m pytest -q
# harness` / `python -m pytest -q` runs. Override it, keeping the other
# defaults that are still useful to skip.
norecursedirs = .git .svn .tox dist *.egg venv .venv node_modules
