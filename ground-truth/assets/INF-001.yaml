# harness §7.2 row INF-001 / §6 role `root-ca`.
id: INF-001
tier: A
domain: infrastructure
application: pki
planted_truth:
  role: root-ca
  algorithm_family: RSA
  algorithm: RSA
  parameters: { key_bits: 4096 }
  primitive: signature
  purpose: ca-signing
  security_function: true
  reachable: true
  provider: null
  quantum_tier: shor-broken
locations:
  - surface: artifact
    path: targets/infrastructure/pki/root-ca/cert.pem   # generated at build time, never committed (H3)
  # Where generate-pki.sh actually writes this role's certificate. Recorded so
  # the scorer can tell whether a run had the chance to see this asset at all;
  # the join itself is by ROLE (H3: ground truth never names a fingerprint --
  # score_run.py resolves pki_role -> fingerprint via pki-lock.generated.json).
  - surface: artifact
    path: harness/build/out/root-ca/cert.pem
    pki_role: root-ca
expected_observation:
  must_be:
    - "algorithm KNOWN (certificate file)"
  # Machine-readable encoding of the prose above, per surface (harness §8.2).
  # A certificate read off disk is a direct artefact read, so the fields the
  # certificate actually carries are KNOWN. The three fields below are NOT
  # carried by this certificate -- an RSA key has no curve, and a root CA cert
  # issued by generate-pki.sh has no EKU and no SAN. There is nothing to
  # observe, so any value reported for them would be fabricated, which is
  # precisely the over-claim §8.2 scores.
  field_states:
    artifact:
      der_sha256: KNOWN
      spki_sha256: KNOWN
      subject: KNOWN
      issuer: KNOWN
      serial_number: KNOWN
      not_before: KNOWN
      not_after: KNOWN
      public_key_algorithm: KNOWN
      public_key_size: KNOWN
      public_key_curve: UNKNOWN        # RSA key -- no curve exists to observe
      signature_algorithm: KNOWN
      key_usage: KNOWN
      extended_key_usage: UNKNOWN      # no EKU extension on this certificate
      subject_alt_names: UNKNOWN       # no SAN extension on this certificate
      is_ca: KNOWN
      source_format: KNOWN
declared_context:
  business_criticality: critical
  data_class: null
  data_lifetime_years: 20
  exposure: internal
  environment: prod
migration: null
misuse_note: null
