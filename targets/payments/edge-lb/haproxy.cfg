# harness §5.3 (verbatim): TLS terminates HERE, not in payment-gateway.
# Expected relationship: edge-lb --terminates-tls-for--> payment-gateway =
# config_declared / DECLARED (from this file), never observed.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend pay_in
    bind *:8443 ssl crt /etc/haproxy/certs/pay-edge.pem ssl-min-ver TLSv1.2 ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    default_backend gateway

backend gateway
    server gw payment-gateway:8080          # plaintext behind the LB
